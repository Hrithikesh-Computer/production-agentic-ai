[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-response-reference"
version = "0.1.0"
description = "Reference implementation and engineering workspace for adaptive response filtering"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = [
    "04-reference-implementation/adaptive-response-filter",
    "tests",
    "prototypes/crm_operational_copilot",
]
pythonpath = ["04-reference-implementation", "prototypes/crm_operational_copilot"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N"]
