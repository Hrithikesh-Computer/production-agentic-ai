name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Lint with Ruff
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest -q

      - name: Type check with mypy
        env:
          MYPYPATH: 04-reference-implementation:prototypes/crm_operational_copilot
        run: >-
          python -m mypy
          04-reference-implementation/adaptive-response-filter
          prototypes/crm_operational_copilot/approval_workflow.py
          prototypes/crm_operational_copilot/test_approval_workflow.py

      - name: Execute Reference Demo
        run: python 04-reference-implementation/adaptive-response-filter/demo.py
