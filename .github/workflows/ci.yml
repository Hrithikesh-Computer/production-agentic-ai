name: CI

on:
  push:
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock

      - name: Lint with Ruff
        run: python -m ruff check .

      - name: Run tests with protocol coverage gate
        run: >-
          python -m pytest -q
          --cov=envelope
          --cov=reassembler
          --cov=ndjson_stream
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=90

      - name: Generate coverage JSON
        run: python -m coverage json -o coverage.json

      - name: Check per-file protocol coverage
        run: python scripts/check_coverage_per_file.py coverage.json

      - name: Run mutation checks
        run: python mutation_check.py

      - name: Audit locked dependencies
        run: python -m pip_audit

      - name: Check Markdown links
        run: python scripts/check_markdown_links.py

      - name: Check response-delivery evidence figures
        run: python scripts/check_response_delivery_evidence.py

      - name: Check CRM validation evidence
        run: python scripts/check_crm_validation_evidence.py

      - name: Type check with mypy
        env:
          MYPYPATH: 04-reference-implementation:prototypes/crm_operational_copilot
        run: >-
          python -m mypy
          04-reference-implementation/adaptive-response-filter
          prototypes/crm_operational_copilot/approval_workflow.py
          prototypes/crm_operational_copilot/test_approval_workflow.py

      - name: Type check entire repository
        run: python -m mypy .

      - name: Execute Reference Demo
        run: python 04-reference-implementation/adaptive-response-filter/demo.py
